<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; media-src file:; style-src 'self'; script-src 'self'"
    />
    <title>Pokémon Meeting Reminder</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="stage">
      <div id="banner" class="banner" hidden>
        <div class="banner-text">
          <span id="banner-name" class="name"></span>
          <span id="banner-meeting" class="meeting"></span>
        </div>
        <div id="banner-actions" class="actions">
          <button id="join" type="button" hidden>Join</button>
          <button id="dismiss" type="button" hidden>Dismiss</button>
        </div>
      </div>
      <div id="actor"><img id="sprite" alt="" draggable="false" /></div>
    </div>
    <script src="../shared/scene-math.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
